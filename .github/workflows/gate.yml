# The org ruleset's required check (COI-3297): a job named `gate`, on PRs and main pushes.
# Runs the validate steps of build-publish.yml without publishing. No secrets.
name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: coilyco/.github/actions/setup-ci@b975f9dbb2a7c7dd7315f4b53dd3212c9b1e2685
        with:
          tools: just
      - run: just install
      - run: just lint
      - run: just typecheck
      - run: just test
