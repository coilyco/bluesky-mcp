repos:
  - repo: local
    hooks:
      - id: npm-lint
        name: npm lint
        entry: npm run lint
        language: system
        pass_filenames: false
      - id: npm-typecheck
        name: npm typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
      - id: npm-test
        name: npm test
        entry: npm test
        language: system
        pass_filenames: false
      - id: trufflehog
        name: trufflehog (secret scan, offline)
        entry: trufflehog git file://. --since-commit HEAD --no-verification --no-update --fail
        language: system
        pass_filenames: false

  # BEGIN managed by agentic-os/scripts/apply-agentic-os-hooks.py
  - repo: https://forgejo.coilysiren.me/coilyco-flight-deck/agentic-os
    rev: aos-precommit-v0.24.0
    hooks:
      - id: catalog-doc-size
      - id: catalog-trifecta
      - id: documentation-layout
      - id: context-load-points
      - id: code-comments
      - id: actions-run-one-line
      - id: source-doc-refs
      - id: catalog-block-present
      - id: check-skills
      - id: dead-cross-links
      - id: repo-pointer-skills
      - id: misplaced-skills
      - id: agent-compose-size
      - id: agent-compose-dedup
      - id: trufflehog
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: mixed-line-ending
      - id: check-json
      - id: check-toml
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.(ya?ml)$
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        exclude: ^shell/(zshrc|warp\.zsh)$
        args: [--severity=error]
  - repo: https://github.com/crate-ci/typos
    rev: v1.48.0
    hooks:
      - id: typos
        args: []
  # END managed by agentic-os/scripts/apply-agentic-os-hooks.py
