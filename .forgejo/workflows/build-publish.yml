name: build-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v4
      - run: just install
      - run: just lint
      - run: just typecheck
      - run: just test
      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
  publish:
    needs: validate
    runs-on: deploy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Publish immutable Bluesky MCP image
        run: bash scripts/publish-image.sh
      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
